<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Communicative English lessons for online 1:1 classes — tenses, vocabulary, and speaking."
    />
    <title>English Lessons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Serif:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="./">English Lessons</a>
      <nav aria-label="Main">
        <a href="#lessons">Lessons</a>
      </nav>
    </header>

    <main class="page-shell">
      <div class="container">
        <section class="hero">
          <p class="lesson-eyebrow">Communicative English • Online 1:1</p>
          <h1>Lesson library</h1>
          <p>
            Structured 60-minute lessons with warm-up, grammar workout, vocabulary,
            and speaking — optimised for screen share and mobile study.
          </p>
        </section>

        <section id="lessons" aria-labelledby="lessons-heading">
          <h2 id="lessons-heading" class="visually-hidden">Available lessons</h2>
          <div id="lesson-grid" class="lesson-grid"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">Built for responsive online English teaching.</footer>

    <script type="module" src="/src/scripts/main.js"></script>
    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </body>
</html>
